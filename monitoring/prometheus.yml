# Prometheus configuration for Artomate

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Artomate API metrics
  - job_name: 'artomate-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
