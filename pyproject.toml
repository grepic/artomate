[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artomate"
version = "0.1.0"
description = "Content-to-Commerce automation system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Artomate Team"}
]
keywords = ["automation", "print-on-demand", "etsy", "printify", "ai-art"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "Pillow>=10.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "python-slugify>=8.0.0",
    "python-dateutil>=2.8.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
export = [
    "xmltodict>=0.13.0",
    "dicttoxml>=1.7.16",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
all = [
    "artomate[api,export,dev]",
]

[project.scripts]
artomate = "artomate.cli.main:cli"

[project.urls]
Homepage = "https://github.com/yourusername/artomate"
Repository = "https://github.com/yourusername/artomate"
Issues = "https://github.com/yourusername/artomate/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["artomate*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=artomate --cov-report=html --cov-report=term"
